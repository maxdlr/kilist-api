services:
  kilist-db:
    container_name: $DB_CONTAINER_NAME
    image: mariadb
    # restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_USERNAME: root
    ports:
      - $DB_PORT:3306
  kilist-db-test:
    container_name: $DB_TEST_CONTAINER_NAME
    image: mariadb
    # restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: root
      MARIADB_ROOT_USERNAME: root
    ports:
      - $DB_TEST_PORT:3306
  adminer:
    container_name: $DB_CONTAINER_NAME-adminer
    image: adminer
    # restart: unless-stopped
    ports:
      - $ADMINER_PORT:8080
